server:
  address: ${DBPULSE_BIND_ADDRESS:127.0.0.1}
  port: ${DBPULSE_API_PORT:8081}
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: dbpulse-api
  datasource:
    url: ${DBPULSE_META_JDBC_URL:jdbc:postgresql://localhost:5544/dbpulse}
    username: ${DBPULSE_META_USERNAME:dbpulse}
    password: ${DBPULSE_META_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 3000
  sql:
    init:
      mode: always
  jackson:
    time-zone: UTC
dbpulse:
  credentials:
    # Opt-in current-Windows-user DPAPI; unavailable in Linux/Docker.
    windows-dpapi-enabled: ${DBPULSE_WINDOWS_DPAPI_ENABLED:false}
  # Manual localhost onboarding; default disabled until operator opts in.
  local-targets:
    enabled: ${DBPULSE_LOCAL_TARGETS_ENABLED:false}
    # Only local DBPulseLab developer certificates; never use for remote hosts.
    allow-self-signed-lab: ${DBPULSE_LOCAL_TRUST_SELF_SIGNED:false}
    allowed-hosts: ${DBPULSE_LOCAL_ALLOWED_DB_HOSTS:host.docker.internal,localhost,127.0.0.1}
  cpu:
    enabled: ${DBPULSE_SQLSERVER_CPU_ENABLED:false}
    interval-ms: ${DBPULSE_SQLSERVER_CPU_INTERVAL_MS:60000}
  query-analytics:
    interval-ms: ${DBPULSE_QUERY_ANALYTICS_INTERVAL_MS:60000}
    # Disable ONLY for isolated A/B fixed-60s baseline; default guard remains active.
    adaptive-enabled: ${DBPULSE_QUERY_ANALYTICS_ADAPTIVE_ENABLED:true}
  query-text:
    enabled: ${DBPULSE_QUERY_TEXT_ENABLED:false}
  collector:
    interval-ms: ${DBPULSE_COLLECT_INTERVAL_MS:5000}
    slow-threshold-ms: ${DBPULSE_SLOW_THRESHOLD_MS:1000}
  mssql:
    enabled: ${DBPULSE_MSSQL_ENABLED:false}
    id: local-mssql
    name: Local SQL Server
    host: ${DBPULSE_MSSQL_HOST:localhost}
    port: ${DBPULSE_MSSQL_PORT:1433}
    database: ${DBPULSE_MSSQL_DATABASE:DBPulseLab}
    username: ${DBPULSE_MSSQL_USERNAME:}
    password: ${DBPULSE_MSSQL_PASSWORD:}
    trust-server-certificate: ${DBPULSE_MSSQL_TRUST_SERVER_CERTIFICATE:false}
